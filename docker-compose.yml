services:
  app:
    build: .
    ports:
      - "4444:4444"
    environment:
      - DATABASE_URL=postgres://postgres:password@db:5432/bulletcloud?sslmode=disable
      - PORT=4444
      - ALLOWED_ORIGINS=http://localhost:8880,http://localhost:8888,http://localhost:5173
      - LOG_LEVEL=info
      - JWT_SECRET=change-me-in-production-min-32-chars
      - JWT_TTL=24h
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  db:
    image: postgres:17-alpine
    environment:
      - POSTGRES_DB=bulletcloud
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bulletcloud"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
