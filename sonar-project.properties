# SonarCloud analysis scope.
# - vendor/**: third-party vendored dependencies (e.g. a dep's own Dockerfile) are not our
#   code and must not affect our quality gate.
# - internal/database/migrations/**: schema migrations are intentional full-table DDL/DML;
#   Sonar's generic SQL rules (e.g. "UPDATE without WHERE") do not apply to them.
sonar.exclusions=vendor/**,internal/database/migrations/**,.pentest/**
